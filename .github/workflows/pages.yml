name: Validate and publish Pages
on:
  pull_request:
  push:
    branches: ["claude/optimistic-cori-5e5735", "work/share-visibility-20261102"]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-locales.py --check
      - run: node --test scripts/*.test.*
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: node scripts/browser-smoke.cjs
      - run: BROWSER=webkit node scripts/browser-smoke.cjs
      - run: node scripts/share-visual.cjs
      - run: BROWSER_ENGINE=webkit node scripts/share-visual.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: share-visibility
          path: test-artifacts/*.png
          retention-days: 3
      - run: python scripts/test-pages.py
      - run: python scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/optimistic-cori-5e5735'
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/optimistic-cori-5e5735'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages source and latest publication commit
        uses: actions/github-script@v7
        with:
          script: |
            const pages = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            if (pages.data.build_type !== 'workflow') throw new Error('Set Settings > Pages > Source to GitHub Actions before merging.');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'claude/optimistic-cori-5e5735'});
            if (branch.data.commit.sha !== context.sha) throw new Error('A newer publication commit exists; this run must not deploy.');
      - name: Deploy the validated artifact from this run
        id: deployment
        uses: actions/deploy-pages@v4
